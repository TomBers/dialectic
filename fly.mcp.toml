app = 'rationalgrid-mcp'
primary_region = 'ams'
kill_signal = 'SIGTERM'

[build]
  dockerfile = 'Dockerfile.mcp'

[env]
  PHOENIX_BASE_URL = 'https://rationalgrid.ai'
  OAUTH_ISSUER_URL = 'https://rationalgrid.ai'
  MCP_PUBLIC_URL = 'https://rationalgrid-mcp.fly.dev/mcp'

[http_service]
  internal_port = 4001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = '10s'
  interval = '15s'
  timeout = '5s'
  method = 'GET'
  path = '/health'
  [http_service.checks.headers]
    Host = 'rationalgrid-mcp.fly.dev'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
